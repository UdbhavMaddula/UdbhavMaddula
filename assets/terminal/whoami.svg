<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05070C" />
      <stop offset="100%" stop-color="#020305" />
    </linearGradient>
    <filter id="cyanGlow2">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .term-user { font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 700; fill: #00FF9D; }
    .term-path { font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 700; fill: #00E5FF; }
    .term-cmd { font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 700; fill: #FFFFFF; }
    .term-cursor { fill: #00FF9D; animation: cursorBlink 1s infinite; }
  </style>

  <rect width="850" height="160" rx="8" fill="url(#termBg)" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1.5"/>

  <!-- Top Window Bar -->
  <rect x="0" y="0" width="850" height="35" rx="8" fill="rgba(15, 23, 38, 0.9)"/>
  <circle cx="20" cy="18" r="5" fill="#FF3B30"/>
  <circle cx="36" cy="18" r="5" fill="#FF9500"/>
  <circle cx="52" cy="18" r="5" fill="#00FF9D"/>
  <text x="425" y="22" font-family="Fira Code" font-size="11" fill="#8B949E" text-anchor="middle">bash — udbhav@system: ~ (x86_64)</text>

  <!-- Terminal Content Line 1 -->
  <g transform="translate(25, 70)">
    <text class="term-user">udbhav@system</text>
    <text x="115" class="term-cmd">:</text>
    <text x="125" class="term-path">~</text>
    <text x="135" class="term-cmd">$ ./initialize-identity-engine</text>
  </g>

  <!-- Terminal Content Line 2 -->
  <g transform="translate(25, 115)">
    <text class="term-user">udbhav@system</text>
    <text x="115" class="term-cmd">:</text>
    <text x="125" class="term-path">~</text>
    <text x="135" class="term-cmd">$ whoami</text>
    <rect x="210" y="-12" width="9" height="16" class="term-cursor" filter="url(#cyanGlow2)"/>
  </g>
</svg>
