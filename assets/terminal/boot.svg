<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bootBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04070D" />
      <stop offset="100%" stop-color="#020305" />
    </linearGradient>
  </defs>
  <style>
    .ok-badge { font-family: 'Fira Code', monospace; font-size: 12px; font-weight: bold; fill: #00FF9D; }
    .boot-text { font-family: 'Fira Code', monospace; font-size: 12px; fill: #E6EDF3; }
  </style>

  <rect width="850" height="180" rx="8" fill="url(#bootBg)" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1.5"/>

  <g transform="translate(30, 30)">
    <text x="0" y="0" class="boot-text" fill="#8B949E">udbhav@system:~$ ./initialize</text>
    <text x="0" y="25" class="ok-badge">[ OK ] <tspan class="boot-text">surveillance-engine initialized (v4.9)</tspan></text>
    <text x="0" y="50" class="ok-badge">[ OK ] <tspan class="boot-text">network-monitor active (interfaces: eth0, wlan0)</tspan></text>
    <text x="0" y="75" class="ok-badge">[ OK ] <tspan class="boot-text">behavioral-analysis online</tspan></text>
    <text x="0" y="100" class="ok-badge">[ OK ] <tspan class="boot-text">evidence-correlation engine primed</tspan></text>
    <text x="0" y="125" class="boot-text" fill="#00E5FF">udbhav@system:~$ trace --subject unknown</text>
  </g>
</svg>
