<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00FF9D" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Cyber Hexagon -->
  <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="none" stroke="url(#logoGrad)" stroke-width="2.5" filter="url(#glow)" />
  
  <!-- Inner Reticle & U Stylized Emblem -->
  <path d="M 32 30 L 32 60 C 32 72, 68 72, 68 60 L 68 30" fill="none" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 42 35 L 50 25 L 58 35" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Center Micro Node -->
  <circle cx="50" cy="50" r="4" fill="#00FF9D" filter="url(#glow)"/>
</svg>
