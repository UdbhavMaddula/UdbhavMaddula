<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="revealBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810" />
      <stop offset="50%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="35%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#00FF9D" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <linearGradient id="mottoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <radialGradient id="revealGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0.15)" />
      <stop offset="60%" stop-color="rgba(212, 175, 55, 0.08)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>

    <filter id="ultraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes textPulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 1; filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.6)); }
    }
    .main-name { font-family: 'Fira Code', 'JetBrains Mono', monospace; font-size: 34px; font-weight: 900; fill: url(#nameGrad); letter-spacing: 4px; animation: textPulse 4s infinite ease-in-out; }
    .sub-pillars { font-family: 'Fira Code', monospace; font-size: 15px; font-weight: 800; fill: #00FF9D; letter-spacing: 5px; }
    .motto-text { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: url(#mottoGrad); letter-spacing: 6px; }
    .badge-label { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: bold; fill: #E6EDF3; }
  </style>

  <!-- Background -->
  <rect width="850" height="420" rx="8" fill="url(#revealBg)" />
  <rect width="850" height="420" rx="8" fill="url(#revealGlow)" />

  <!-- Outer Precision Cyber Border -->
  <rect x="15" y="15" width="820" height="390" rx="6" fill="none" stroke="url(#nameGrad)" stroke-width="2" filter="url(#ultraGlow)" />

  <!-- Corner Decors -->
  <path d="M 15 45 L 15 15 L 45 15" fill="none" stroke="#D4AF37" stroke-width="4" />
  <path d="M 835 45 L 835 15 L 805 15" fill="none" stroke="#D4AF37" stroke-width="4" />
  <path d="M 15 375 L 15 405 L 45 405" fill="none" stroke="#00E5FF" stroke-width="4" />
  <path d="M 835 375 L 835 405 L 805 405" fill="none" stroke="#00E5FF" stroke-width="4" />

  <!-- Content Group -->
  <g transform="translate(425, 120)" text-anchor="middle">
    <!-- Top System Verification Seal -->
    <rect x="-140" y="-70" width="280" height="28" rx="14" fill="rgba(0, 255, 157, 0.1)" stroke="#00FF9D" stroke-width="1.5"/>
    <text x="0" y="-52" font-family="Fira Code" font-size="11" font-weight="bold" fill="#00FF9D" letter-spacing="2px">SUBJECT RESOLVED · 100% MATCH</text>

    <!-- Main Name -->
    <text x="0" y="30" class="main-name" filter="url(#ultraGlow)">MAANAS SRI UDBHAV MADDULA</text>

    <!-- Core Pillars -->
    <text x="0" y="75" class="sub-pillars">CHESS  ·  RUN  ·  AI SECURITY</text>

    <line x1="-250" y1="105" x2="250" y2="105" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1"/>

    <!-- Personal Motto -->
    <text x="0" y="135" class="motto-text">DREAM  ·  RUN  ·  REACH  ·  DESTINATION</text>

    <!-- 3 Key Highlight Badges -->
    <g transform="translate(-260, 170)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="160" height="42" rx="4" fill="rgba(13, 19, 32, 0.9)" stroke="#D4AF37" stroke-width="1.5"/>
      <text x="80" y="25" class="badge-label" text-anchor="middle" fill="#D4AF37">2x NATIONAL CHESS</text>
    </g>

    <g transform="translate(-80, 170)">
      <!-- Badge 2 -->
      <rect x="0" y="0" width="160" height="42" rx="4" fill="rgba(13, 19, 32, 0.9)" stroke="#00E5FF" stroke-width="1.5"/>
      <text x="80" y="25" class="badge-label" text-anchor="middle" fill="#00E5FF">PROMPTSHIELD / AISEC</text>
    </g>

    <g transform="translate(100, 170)">
      <!-- Badge 3 -->
      <rect x="0" y="0" width="160" height="42" rx="4" fill="rgba(13, 19, 32, 0.9)" stroke="#00FF9D" stroke-width="1.5"/>
      <text x="80" y="25" class="badge-label" text-anchor="middle" fill="#00FF9D">SOC / BLUE TEAM</text>
    </g>
  </g>
</svg>
