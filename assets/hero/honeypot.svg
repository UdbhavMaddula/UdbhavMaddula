<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <linearGradient id="hpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C0A" />
      <stop offset="50%" stop-color="#0A1C16" />
      <stop offset="100%" stop-color="#050C0A" />
    </linearGradient>
    <filter id="emeraldGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    .hp-title { font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 800; fill: #00FF9D; letter-spacing: 2px; }
    .node-box { fill: rgba(10, 28, 22, 0.9); stroke: #00FF9D; stroke-width: 1.5; }
    .node-text { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: bold; fill: #FFFFFF; }
    .status-text { font-family: 'Fira Code', monospace; font-size: 12px; font-weight: 700; fill: #00FF9D; letter-spacing: 1.5px; }
    .arrow { stroke: #00FF9D; stroke-width: 2; fill: stroke; }
  </style>

  <rect width="850" height="320" rx="8" fill="url(#hpGrad)" />
  <rect x="15" y="15" width="820" height="290" rx="6" fill="none" stroke="#00FF9D" stroke-width="1.5" stroke-dasharray="8,4" />

  <text x="35" y="45" class="hp-title" filter="url(#emeraldGlow)">HONEYPOT TRAP RECONSTRUCTION // ATTACK PATH CAPTURE</text>
  <line x1="35" y1="55" x2="815" y2="55" stroke="rgba(0, 255, 157, 0.2)" stroke-width="1"/>

  <!-- Path Reconstruction Flow (6 Horizontal Blocks) -->
  <!-- 1. SUBJECT -->
  <g transform="translate(35, 90)">
    <rect width="105" height="50" rx="4" class="node-box"/>
    <text x="52" y="30" class="node-text" text-anchor="middle">SUBJECT</text>
  </g>
  <path d="M 145 115 L 160 115" stroke="#00FF9D" stroke-width="2" stroke-linecap="round"/>

  <!-- 2. NETWORK -->
  <g transform="translate(165, 90)">
    <rect width="105" height="50" rx="4" class="node-box"/>
    <text x="52" y="30" class="node-text" text-anchor="middle">NETWORK</text>
  </g>
  <path d="M 275 115 L 290 115" stroke="#00FF9D" stroke-width="2" stroke-linecap="round"/>

  <!-- 3. IP -->
  <g transform="translate(295, 90)">
    <rect width="105" height="50" rx="4" class="node-box"/>
    <text x="52" y="30" class="node-text" text-anchor="middle">IP PROBE</text>
  </g>
  <path d="M 405 115 L 420 115" stroke="#00FF9D" stroke-width="2" stroke-linecap="round"/>

  <!-- 4. FIREWALL -->
  <g transform="translate(425, 90)">
    <rect width="105" height="50" rx="4" class="node-box"/>
    <text x="52" y="30" class="node-text" text-anchor="middle">FIREWALL</text>
  </g>
  <path d="M 535 115 L 550 115" stroke="#00FF9D" stroke-width="2" stroke-linecap="round"/>

  <!-- 5. DMZ -->
  <g transform="translate(555, 90)">
    <rect width="105" height="50" rx="4" class="node-box"/>
    <text x="52" y="30" class="node-text" text-anchor="middle">DMZ TRAP</text>
  </g>
  <path d="M 665 115 L 680 115" stroke="#00FF9D" stroke-width="2" stroke-linecap="round"/>

  <!-- 6. HONEYPOT -->
  <g transform="translate(685, 90)">
    <rect width="130" height="50" rx="4" fill="#00FF9D" stroke="#FFFFFF" stroke-width="2"/>
    <text x="65" y="30" class="node-text" fill="#050C0A" text-anchor="middle">HONEYPOT</text>
  </g>

  <!-- Lock Status Box Below -->
  <rect x="35" y="170" width="780" height="110" rx="6" fill="rgba(5, 12, 10, 0.95)" stroke="#00FF9D" stroke-width="1.5"/>
  <g transform="translate(55, 205)">
    <circle cx="15" cy="10" r="8" fill="#00FF9D" filter="url(#emeraldGlow)"/>
    <text x="35" y="15" class="status-text" filter="url(#emeraldGlow)">[ SUCCESS ] HONEYPOT TRIGGERED</text>
    <text x="35" y="40" class="status-text">[ SUCCESS ] ATTACK SIGNATURE CAPTURED</text>
    <text x="35" y="65" class="status-text">[ SUCCESS ] SUBJECT PROFILE ISOLATED &amp; LOCKED</text>
  </g>
</svg>
