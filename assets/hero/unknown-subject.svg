<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 229, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    @keyframes radarPulse {
      0% { r: 20px; opacity: 0.8; }
      100% { r: 120px; opacity: 0; }
    }
    .hud-header { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 700; fill: #00E5FF; letter-spacing: 2px; }
    .alert-header { font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 800; fill: #FF3B30; letter-spacing: 3px; }
    .metric-title { font-family: 'Fira Code', monospace; font-size: 11px; fill: #8B949E; }
    .metric-val { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: bold; fill: #00FF9D; }
    .radar-circle { fill: none; stroke: #00E5FF; stroke-width: 1.5; animation: radarPulse 3s cubic-bezier(0.1, 0.8, 0.3, 1) infinite; }
  </style>

  <rect width="850" height="380" rx="8" fill="url(#bgGrad2)" />
  <rect width="850" height="380" rx="8" fill="url(#grid2)" />

  <!-- Frame Border -->
  <rect x="15" y="15" width="820" height="350" rx="6" fill="none" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="30" y="30" width="790" height="40" rx="4" fill="rgba(13, 17, 26, 0.9)" stroke="rgba(255, 59, 48, 0.4)" stroke-width="1"/>
  <text x="50" y="55" class="alert-header">SUBJECT DETECTION MODE: UNKNOWN ENTITY</text>
  <text x="630" y="55" class="hud-header">STATUS: PROFILING...</text>

  <!-- Left: Target Tracking HUD -->
  <g transform="translate(180, 220)">
    <circle cx="0" cy="0" r="20" class="radar-circle" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1.5" stroke-dasharray="6,4"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="rgba(0, 229, 255, 0.15)" stroke-width="1"/>
    
    <line x1="-110" y1="0" x2="110" y2="0" stroke="#00E5FF" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="0" y1="-110" x2="0" y2="110" stroke="#00E5FF" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- Reticle Box -->
    <rect x="-45" y="-55" width="90" height="110" fill="none" stroke="#FF3B30" stroke-width="1.5" stroke-dasharray="10,5"/>
    <path d="M 0 -30 L 0 -15 M -15 0 L -5 0 M 5 0 L 15 0 M 0 15 L 0 30" stroke="#00FF9D" stroke-width="2"/>
    
    <!-- Target Text -->
    <text x="-40" y="-65" class="hud-header" font-size="10">LOC: [30.76°N, 76.78°E]</text>
  </g>

  <!-- Right: Telemetry Attributes Table -->
  <g transform="translate(420, 100)">
    <rect x="0" y="0" width="400" height="240" rx="6" fill="rgba(10, 14, 24, 0.85)" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1"/>
    <text x="25" y="35" class="hud-header">FORENSIC OBSERVATIONS</text>

    <line x1="25" y1="45" x2="375" y2="45" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1"/>

    <text x="25" y="75" class="metric-title">BEHAVIORAL VECTOR:</text>
    <text x="200" y="75" class="metric-val">STRATEGIC PATTERN</text>

    <text x="25" y="105" class="metric-title">COGNITIVE LATENCY:</text>
    <text x="200" y="105" class="metric-val">&lt; 12ms (FAST RESPONSE)</text>

    <text x="25" y="135" class="metric-title">PHYSICAL DISCIPLINE:</text>
    <text x="200" y="135" class="metric-val">SUB-26M ATHLETIC PB</text>

    <text x="25" y="165" class="metric-title">SYSTEM INTERACTION:</text>
    <text x="200" y="165" class="metric-val">DEFENSIVE SECURITY / SOC</text>

    <text x="25" y="195" class="metric-title">THREAT LEVEL:</text>
    <text x="200" y="195" fill="#FF9500" font-family="Fira Code" font-weight="bold" font-size="13">NON-MALICIOUS / RECON</text>

    <line x1="25" y1="210" x2="375" y2="210" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1"/>
    <text x="25" y="228" font-family="Fira Code" font-size="10" fill="#00FF9D">&gt; INITIATING DEEPER SIGNATURE ANALYSIS...</text>
  </g>
</svg>
