<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05080E" />
      <stop offset="50%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>

    <radialGradient id="surveillanceGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 229, 255, 0.05)" stroke-width="1"/>
    </pattern>

    <filter id="cyanGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }
    @keyframes scan {
      0% { transform: translateY(0px); }
      50% { transform: translateY(380px); }
      100% { transform: translateY(0px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    .status-active { fill: #00FF9D; font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .status-alert { fill: #FF9500; font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .hud-text { fill: #00E5FF; font-family: 'Fira Code', monospace; font-size: 12px; letter-spacing: 1.5px; }
    .alert-text { fill: #FF3B30; font-family: 'Fira Code', monospace; font-size: 12px; font-weight: bold; letter-spacing: 2px; }
    .scan-line { stroke: rgba(0, 229, 255, 0.4); stroke-width: 1.5; animation: scan 6s ease-in-out infinite; }
    .blink-dot { animation: blink 1.2s infinite; }
    .pulse-bg { animation: pulse 4s ease-in-out infinite; }
  </style>

  <!-- Dark Background & Grid -->
  <rect width="850" height="420" rx="8" fill="url(#bgGrad)" />
  <rect width="850" height="420" rx="8" fill="url(#grid)" />
  <rect width="850" height="420" rx="8" fill="url(#surveillanceGlow)" class="pulse-bg" />

  <!-- Outer Glass Frame -->
  <rect x="15" y="15" width="820" height="390" rx="6" fill="none" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1.5" />
  
  <!-- Corner Reticle Markers -->
  <path d="M 15 35 L 15 15 L 35 15" fill="none" stroke="#00E5FF" stroke-width="3" />
  <path d="M 835 35 L 835 15 L 815 15" fill="none" stroke="#00E5FF" stroke-width="3" />
  <path d="M 15 385 L 15 405 L 35 405" fill="none" stroke="#00E5FF" stroke-width="3" />
  <path d="M 835 385 L 835 405 L 815 405" fill="none" stroke="#00E5FF" stroke-width="3" />

  <!-- Top Camera / Feed Header -->
  <rect x="30" y="30" width="790" height="40" rx="4" fill="rgba(10, 14, 26, 0.8)" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1"/>
  <circle cx="50" cy="50" r="5" fill="#FF3B30" class="blink-dot" filter="url(#cyanGlow)"/>
  <text x="65" y="54" class="alert-text">REC [CAM-01] · INTERROGATION ROOM SURVEILLANCE</text>
  <text x="660" y="54" class="hud-text">SYS.VER: 4.9.2-SEC</text>

  <!-- Center Target Grid Reticle -->
  <circle cx="425" cy="215" r="90" fill="none" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="425" cy="215" r="130" fill="none" stroke="rgba(0, 229, 255, 0.15)" stroke-width="1"/>
  <line x1="265" y1="215" x2="585" y2="215" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="425" y1="95" x2="425" y2="335" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Silhouette Vector Representation -->
  <path d="M 425 155 A 25 25 0 1 0 425 205 A 25 25 0 1 0 425 155 Z" fill="rgba(0, 229, 255, 0.1)" stroke="#00E5FF" stroke-width="1.5"/>
  <path d="M 375 265 C 375 225, 475 225, 475 265 Z" fill="rgba(0, 229, 255, 0.1)" stroke="#00E5FF" stroke-width="1.5"/>

  <!-- Scanning Line -->
  <line x1="20" y1="0" x2="830" y2="0" class="scan-line" />

  <!-- Terminal Event Log Box Bottom Left -->
  <rect x="30" y="280" width="480" height="110" rx="4" fill="rgba(5, 8, 14, 0.9)" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1"/>
  <text x="45" y="305" class="status-active">[ OK ] SYSTEM INITIALIZED</text>
  <text x="45" y="325" class="status-active">[ OK ] SURVEILLANCE ACTIVE</text>
  <text x="45" y="345" class="status-alert">[ WARNING ] MOTION DETECTED</text>
  <text x="45" y="365" class="status-alert">[ WARNING ] MOVEMENT DETECTED</text>
  <text x="45" y="380" class="alert-text">[ ALERT ] NETWORK ACTIVITY DETECTED</text>

  <!-- Right Telemetry Panel -->
  <rect x="530" y="280" width="290" height="110" rx="4" fill="rgba(5, 8, 14, 0.9)" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1"/>
  <text x="545" y="305" class="hud-text">TARGET STATE: LOCKED</text>
  <text x="545" y="330" class="hud-text">SIGNAL STRENGTH: 98.4%</text>
  <text x="545" y="355" class="hud-text">SUBJECT ID: UNKNOWN-0X9A</text>
  <text x="545" y="375" class="status-active">BEHAVIORAL SCAN: ACTIVE</text>
</svg>
