<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="100%" height="100%">
  <defs>
    <linearGradient id="evGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    .ev-header { font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 800; fill: #00E5FF; letter-spacing: 2px; }
    .ev-step { font-family: 'Fira Code', monospace; font-size: 11px; fill: #00FF9D; font-weight: bold; }
    .sig-title { font-family: 'Fira Code', monospace; font-size: 12px; font-weight: 800; fill: #D4AF37; }
    .sig-detail { font-family: 'Inter', sans-serif; font-size: 10px; fill: #8B949E; }
    .center-title { font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 900; fill: #00E5FF; letter-spacing: 2px; }
  </style>

  <rect width="850" height="400" rx="8" fill="url(#evGrad)" />
  <rect x="15" y="15" width="820" height="370" rx="6" fill="none" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1.5" />

  <!-- Top Analysis Log Bar -->
  <rect x="35" y="30" width="780" height="70" rx="4" fill="rgba(5, 8, 14, 0.9)" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1"/>
  <g transform="translate(50, 50)">
    <text x="0" y="0" class="ev-step">&gt; ANALYZING BEHAVIOR...</text>
    <text x="200" y="0" class="ev-step">&gt; CORRELATING EVENTS...</text>
    <text x="0" y="25" class="ev-step">&gt; CROSS-REFERENCING ACTIVITY...</text>
    <text x="200" y="25" class="ev-step" fill="#D4AF37">&gt; BUILDING SUBJECT PROFILE...</text>
  </g>

  <!-- Central Evidence Correlation Map -->
  <!-- Center Core Node -->
  <g transform="translate(425, 250)">
    <circle cx="0" cy="0" r="50" fill="rgba(0, 229, 255, 0.12)" stroke="#00E5FF" stroke-width="2" filter="url(#goldGlow)"/>
    <text x="0" y="-8" class="center-title" text-anchor="middle">SUBJECT</text>
    <text x="0" y="12" class="center-title" text-anchor="middle" fill="#00FF9D" font-size="11">PROFILE</text>

    <!-- 5 Radial Connection Lines -->
    <line x1="0" y1="-50" x2="-220" y2="-100" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="0" y1="-50" x2="220" y2="-100" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="-50" y1="0" x2="-260" y2="40" stroke="#00FF9D" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="50" y1="0" x2="260" y2="40" stroke="#FF9500" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="0" y1="50" x2="0" y2="100" stroke="#E6EDF3" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>

  <!-- Node 1: CHESS (Top Left) -->
  <g transform="translate(80, 120)">
    <rect width="180" height="60" rx="6" fill="rgba(10, 14, 24, 0.9)" stroke="#D4AF37" stroke-width="1.5"/>
    <text x="15" y="25" class="sig-title">1. CHESS</text>
    <text x="15" y="45" class="sig-detail">10+ Yrs · 2x National · 2100 Peak</text>
  </g>

  <!-- Node 2: AI SECURITY (Top Right) -->
  <g transform="translate(590, 120)">
    <rect width="180" height="60" rx="6" fill="rgba(10, 14, 24, 0.9)" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="15" y="25" class="sig-title" fill="#00E5FF">2. AI SECURITY</text>
    <text x="15" y="45" class="sig-detail">PromptShield · AISEC CaseFiles</text>
  </g>

  <!-- Node 3: DEFENSE (Mid Left) -->
  <g transform="translate(40, 260)">
    <rect width="180" height="60" rx="6" fill="rgba(10, 14, 24, 0.9)" stroke="#00FF9D" stroke-width="1.5"/>
    <text x="15" y="25" class="sig-title" fill="#00FF9D">3. DEFENSE</text>
    <text x="15" y="45" class="sig-detail">SOC L1 · TryHackMe · Wazuh/Logs</text>
  </g>

  <!-- Node 4: RUNNING (Mid Right) -->
  <g transform="translate(630, 260)">
    <rect width="180" height="60" rx="6" fill="rgba(10, 14, 24, 0.9)" stroke="#FF9500" stroke-width="1.5"/>
    <text x="15" y="25" class="sig-title" fill="#FF9500">4. RUNNING</text>
    <text x="15" y="45" class="sig-detail">Sub-26m 5K · IAF Seekhon PB</text>
  </g>

  <!-- Node 5: DISCIPLINE (Bottom Center) -->
  <g transform="translate(335, 320)">
    <rect width="180" height="50" rx="6" fill="rgba(10, 14, 24, 0.9)" stroke="#E6EDF3" stroke-width="1.5"/>
    <text x="15" y="22" class="sig-title" fill="#E6EDF3">5. DISCIPLINE</text>
    <text x="15" y="40" class="sig-detail">4x Donor · Environmental Work</text>
  </g>
</svg>
