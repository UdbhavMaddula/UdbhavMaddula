<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="100%">
  <defs>
    <linearGradient id="resGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060C14" />
      <stop offset="100%" stop-color="#0A1624" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="70%" stop-color="#00FF9D" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="resGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    @keyframes fillProgress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    .res-title { font-family: 'Fira Code', monospace; font-size: 16px; font-weight: 900; fill: #00E5FF; letter-spacing: 3px; }
    .pct-text { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: bold; fill: #8B949E; }
    .complete-badge { font-family: 'Fira Code', monospace; font-size: 15px; font-weight: 900; fill: #00FF9D; letter-spacing: 2.5px; }
    .progress-bar-inner { animation: fillProgress 4s cubic-bezier(0.1, 0.7, 0.1, 1) forwards; }
  </style>

  <rect width="850" height="280" rx="8" fill="url(#resGrad)" />
  <rect x="15" y="15" width="820" height="250" rx="6" fill="none" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1.5" />

  <!-- Header -->
  <text x="40" y="55" class="res-title" filter="url(#resGlow)">IDENTITY RESOLUTION IN PROGRESS</text>
  <line x1="40" y1="68" x2="810" y2="68" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1"/>

  <!-- Percentage Timeline Ticker -->
  <g transform="translate(40, 105)">
    <text x="0" y="0" class="pct-text">12% INGEST</text>
    <text x="180" y="0" class="pct-text">37% BEHAVIOR</text>
    <text x="370" y="0" class="pct-text">67% FORENSIC</text>
    <text x="560" y="0" class="pct-text">94% MATCH</text>
    <text x="700" y="0" class="pct-text" fill="#00FF9D">100% CONFIRMED</text>
  </g>

  <!-- Progress Bar Container -->
  <g transform="translate(40, 125)">
    <rect width="770" height="24" rx="12" fill="rgba(5, 8, 14, 0.9)" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1.5"/>
    <rect width="770" height="24" rx="12" fill="url(#barGrad)" filter="url(#resGlow)"/>
  </g>

  <!-- Complete Status Box -->
  <rect x="40" y="175" width="770" height="60" rx="6" fill="rgba(0, 255, 157, 0.08)" stroke="#00FF9D" stroke-width="1.5"/>
  <g transform="translate(425, 210)" text-anchor="middle">
    <text x="0" y="0" class="complete-badge" filter="url(#resGlow)">[ PROFILE COMPLETE ] MATCH CONFIRMED: 100% ACCURACY</text>
    <text x="0" y="18" font-family="Fira Code" font-size="11" fill="#8B949E">&gt; INITIATING TERMINAL IDENTITY HANDSHAKE...</text>
  </g>
</svg>
