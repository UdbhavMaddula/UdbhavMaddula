<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Board Square Fills -->
    <linearGradient id="sqDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B101D" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>
    <linearGradient id="sqLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2638" />
      <stop offset="100%" stop-color="#101A28" />
    </linearGradient>
    <linearGradient id="boardFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#1E2B40" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Piece Glow Filters -->
    <filter id="goldGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cyanGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-code { font-family: 'Fira Code', 'JetBrains Mono', monospace; }
    .font-sans { font-family: 'Inter', system-ui, sans-serif; }
    
    .piece-node { cursor: pointer; transition: transform 0.3s ease, filter 0.3s ease; }
    .piece-node:hover { transform: scale(1.12); filter: drop-shadow(0 0 16px #00FF9D); }
  </style>

  <!-- Container Dark Background -->
  <rect width="1600" height="900" fill="#030509" stroke="rgba(212, 175, 55, 0.4)" stroke-width="2"/>

  <!-- Top Navigation Header -->
  <g transform="translate(60, 50)">
    <text class="font-code" font-size="28" font-weight="900" fill="#D4AF37" letter-spacing="4" filter="url(#goldGlowFilter)">CHESS ENDGAME NAVIGATION — SELECT YOUR MOVE</text>
    <text y="38" class="font-code" font-size="16" fill="#00FF9D" letter-spacing="2">&gt; INTERFACE ACTIVE — SELECT A PIECE BELOW OR IN THE INDEX TO ENGAGE PROFILE DOMAIN</text>
  </g>

