  <g transform="translate(60, 120)">
    <!-- Board Outer Border Frame -->
    <rect x="-16" y="-16" width="732" height="732" rx="10" fill="url(#boardFrameGrad)"/>
    <rect x="-6" y="-6" width="712" height="712" fill="#04060A"/>

    <!-- 64 Squares Grid (8x8) -->
    <!-- Row 0 (Rank 8) -->
    <rect x="0" y="0" width="87.5" height="87.5" fill="url(#sqLight)"/>
    <rect x="87.5" y="0" width="87.5" height="87.5" fill="url(#sqDark)"/>
    <rect x="175" y="0" width="87.5" height="87.5" fill="url(#sqLight)"/>
    <rect x="262.5" y="0" width="87.5" height="87.5" fill="url(#sqDark)"/>
    <rect x="350" y="0" width="87.5" height="87.5" fill="url(#sqLight)"/>
    <rect x="437.5" y="0" width="87.5" height="87.5" fill="url(#sqDark)"/>
    <rect x="525" y="0" width="87.5" height="87.5" fill="url(#sqLight)"/>
    <rect x="612.5" y="0" width="87.5" height="87.5" fill="url(#sqDark)"/>

    <!-- Row 1 (Rank 7) -->
    <rect x="0" y="87.5" width="87.5" height="87.5" fill="url(#sqDark)"/>
    <rect x="87.5" y="87.5" width="87.5" height="87.5" fill="url(#sqLight)"/>
    <rect x="175" y="87.5" width="87.5" height="87.5" fill="url(#sqDark)"/>
    <rect x="262.5" y="87.5" width="87.5" height="87.5" fill="url(#sqLight)"/>
    <rect x="350" y="87.5" width="87.5" height="87.5" fill="url(#sqDark)"/>
    <rect x="437.5" y="87.5" width="87.5" height="87.5" fill="url(#sqLight)"/>
    <rect x="525" y="87.5" width="87.5" height="87.5" fill="url(#sqDark)"/>
    <rect x="612.5" y="87.5" width="87.5" height="87.5" fill="url(#sqLight)"/>

    <!-- Row 2 (Rank 6) -->
    <rect x="0" y="175" width="87.5" height="87.5" fill="url(#sqLight)"/>
    <rect x="87.5" y="175" width="87.5" height="87.5" fill="url(#sqDark)"/>
    <rect x="175" y="175" width="87.5" height="87.5" fill="url(#sqLight)"/>
    <rect x="262.5" y="175" width="87.5" height="87.5" fill="url(#sqDark)"/>
    <rect x="350" y="175" width="87.5" height="87.5" fill="url(#sqLight)"/>
    <rect x="437.5" y="175" width="87.5" height="87.5" fill="url(#sqDark)"/>
    <rect x="525" y="175" width="87.5" height="87.5" fill="url(#sqLight)"/>
    <rect x="612.5" y="175" width="87.5" height="87.5" fill="url(#sqDark)"/>

    <!-- Row 3 (Rank 5) -->
    <rect x="0" y="262.5" width="87.5" height="87.5" fill="url(#sqDark)"/>
    <rect x="87.5" y="262.5" width="87.5" height="87.5" fill="url(#sqLight)"/>
    <rect x="175" y="262.5" width="87.5" height="87.5" fill="url(#sqDark)"/>
    <rect x="262.5" y="262.5" width="87.5" height="87.5" fill="url(#sqLight)"/>
    <rect x="350" y="262.5" width="87.5" height="87.5" fill="#2D3B20"/> <!-- Highlight e5 Pawn -->
    <rect x="437.5" y="262.5" width="87.5" height="87.5" fill="url(#sqLight)"/>
    <rect x="525" y="262.5" width="87.5" height="87.5" fill="url(#sqDark)"/>
    <rect x="612.5" y="262.5" width="87.5" height="87.5" fill="url(#sqLight)"/>

    <!-- Row 4 (Rank 4) -->
    <rect x="0" y="350" width="87.5" height="87.5" fill="url(#sqLight)"/>
    <rect x="87.5" y="350" width="87.5" height="87.5" fill="url(#sqDark)"/>
    <rect x="175" y="350" width="87.5" height="87.5" fill="#3D3818"/> <!-- Highlight c4 Bishop -->
    <rect x="262.5" y="350" width="87.5" height="87.5" fill="#4A3C15"/> <!-- Highlight d4 Queen -->
    <rect x="350" y="350" width="87.5" height="87.5" fill="url(#sqLight)"/>
    <rect x="437.5" y="350" width="87.5" height="87.5" fill="url(#sqDark)"/>
    <rect x="525" y="350" width="87.5" height="87.5" fill="url(#sqLight)"/>
    <rect x="612.5" y="350" width="87.5" height="87.5" fill="url(#sqDark)"/>

    <!-- Row 5 (Rank 3) -->
    <rect x="0" y="437.5" width="87.5" height="87.5" fill="url(#sqDark)"/>
    <rect x="87.5" y="437.5" width="87.5" height="87.5" fill="url(#sqLight)"/>
    <rect x="175" y="437.5" width="87.5" height="87.5" fill="url(#sqDark)"/>
    <rect x="262.5" y="437.5" width="87.5" height="87.5" fill="url(#sqLight)"/>
    <rect x="350" y="437.5" width="87.5" height="87.5" fill="url(#sqDark)"/>
