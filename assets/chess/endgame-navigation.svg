      <circle cx="43.75" cy="43.75" r="34" fill="rgba(255, 255, 255, 0.35)" stroke="#FFFFFF" stroke-width="3"/>
      <text x="43.75" y="57" font-size="44" text-anchor="middle" fill="#FFFFFF">♙</text>
    </g>
  </g>

  <!-- Right Side: Navigation Index Legend Panel (X: 810, Y: 120, Width: 730) -->
  <g transform="translate(810, 120)">
    <rect width="730" height="732" rx="10" fill="rgba(8, 14, 24, 0.95)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="2"/>

    <text x="35" y="45" class="font-code" font-size="22" font-weight="900" fill="#D4AF37" letter-spacing="3">TACTICAL NAVIGATION INDEX</text>
    <line x1="35" y1="60" x2="695" y2="60" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1.5"/>

    <!-- 6 Interactive Items -->
    <!-- KING -->
    <g transform="translate(35" y="85">
      <text x="0" y="30" font-size="36" fill="#FFD700">♔</text>
      <text x="50" y="24" class="font-code" font-size="18" font-weight="900" fill="#FFD700">KING [e1] → IDENTITY &amp; CORE PROFILE</text>
      <text x="50" y="48" class="font-sans" font-size="14" fill="#8B949E">Maanas Sri Udbhav Maddula profile, background, &amp; core identity</text>
