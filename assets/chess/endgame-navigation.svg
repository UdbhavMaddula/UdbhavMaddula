      <text x="0" y="30" font-size="36" fill="#FFFFFF">♙</text>
      <text x="50" y="24" class="font-code" font-size="18" font-weight="900" fill="#FFFFFF">PAWN [e5] → GROWTH &amp; DISCIPLINE</text>
      <text x="50" y="48" class="font-sans" font-size="14" fill="#8B949E">Pawn Mindset, 4x Voluntary Blood Donor, Environmental Impact Drives</text>
