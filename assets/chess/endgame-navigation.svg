    <!-- Board Files Labels a-h -->
    <text x="43.75" y="722" class="font-code" font-size="16" font-weight="bold" fill="#00E5FF" text-anchor="middle">a</text>
    <text x="131.25" y="722" class="font-code" font-size="16" font-weight="bold" fill="#00E5FF" text-anchor="middle">b</text>
    <text x="218.75" y="722" class="font-code" font-size="16" font-weight="bold" fill="#00E5FF" text-anchor="middle">c</text>
    <text x="306.25" y="722" class="font-code" font-size="16" font-weight="bold" fill="#00E5FF" text-anchor="middle">d</text>
    <text x="393.75" y="722" class="font-code" font-size="16" font-weight="bold" fill="#00E5FF" text-anchor="middle">e</text>
    <text x="481.25" y="722" class="font-code" font-size="16" font-weight="bold" fill="#00E5FF" text-anchor="middle">f</text>
    <text x="568.75" y="722" class="font-code" font-size="16" font-weight="bold" fill="#00E5FF" text-anchor="middle">g</text>
    <text x="656.25" y="722" class="font-code" font-size="16" font-weight="bold" fill="#00E5FF" text-anchor="middle">h</text>

    <!-- 6 Tactical Endgame Pieces -->
    <!-- 1. KING on e1 (350, 612.5) -->
    <g class="piece-node" transform="translate(350, 612.5)">
      <circle cx="43.75" cy="43.75" r="34" fill="rgba(212, 175, 55, 0.35)" stroke="#D4AF37" stroke-width="3" filter="url(#goldGlowFilter)"/>
      <text x="43.75" y="57" font-size="44" text-anchor="middle" fill="#FFD700">♔</text>
    </g>

    <!-- 2. QUEEN on d4 (262.5, 350) -->
    <g class="piece-node" transform="translate(262.5, 350)">
      <circle cx="43.75" cy="43.75" r="34" fill="rgba(212, 175, 55, 0.35)" stroke="#D4AF37" stroke-width="3" filter="url(#goldGlowFilter)"/>
      <text x="43.75" y="57" font-size="44" text-anchor="middle" fill="#FFD700">♕</text>
    </g>

    <!-- 3. BISHOP on c4 (175, 350) -->
    <g class="piece-node" transform="translate(175, 350)">
      <circle cx="43.75" cy="43.75" r="34" fill="rgba(0, 229, 255, 0.35)" stroke="#00E5FF" stroke-width="3" filter="url(#cyanGlowFilter)"/>
      <text x="43.75" y="57" font-size="44" text-anchor="middle" fill="#00E5FF">♗</text>
    </g>

    <!-- 4. ROOK on d1 (262.5, 612.5) -->
