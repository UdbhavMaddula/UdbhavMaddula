      <circle cx="43.75" cy="43.75" r="34" fill="rgba(0, 255, 157, 0.35)" stroke="#00FF9D" stroke-width="3" filter="url(#cyanGlowFilter)"/>
      <text x="43.75" y="57" font-size="44" text-anchor="middle" fill="#00FF9D">♖</text>
