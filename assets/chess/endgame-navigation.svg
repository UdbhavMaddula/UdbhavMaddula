      <text x="0" y="30" font-size="36" fill="#FFD700">♕</text>
      <text x="50" y="24" class="font-code" font-size="18" font-weight="900" fill="#FFD700">QUEEN [d4] → CHESS MASTERY</text>
      <text x="50" y="48" class="font-sans" font-size="14" fill="#8B949E">10+ Yrs, 2x National Player, Team AP Captain, North Zone Leader, 2100+ Peak</text>
    </g>

    <!-- BISHOP -->
    <g transform="translate(35" y="295">
      <text x="0" y="30" font-size="36" fill="#00E5FF">♗</text>
      <text x="50" y="24" class="font-code" font-size="18" font-weight="900" fill="#00E5FF">BISHOP [c4] → AI SECURITY RESEARCH</text>
      <text x="50" y="48" class="font-sans" font-size="14" fill="#8B949E">PromptShield, Prompt Injection Research, AISEC CaseFiles</text>
